<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat System</title>
    <link rel="stylesheet" href="css/style.css?v=999">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar"><i class="fas fa-user"></i></div>
                    <div class="user-info">
                        <h3 id="currentUsername">User</h3>
                        <span class="status-text">Online</span>
                    </div>
                </div>
            </div>
            <div class="users-section">
                <h4 class="section-title">Online Users <span class="count" id="onlineCount">0</span></h4>
                <ul class="users-list" id="onlineUsersList"></ul>
            </div>
            <div class="sidebar-footer">
                <button class="nav-btn logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </aside>
        <main class="chat-container">
            <header class="chat-header">
                <h3 id="partnerName">Select a user to chat</h3>
            </header>
            <div class="messages-area" id="messagesArea">
                <div class="empty-state">
                    <h2>Welcome to Chat System</h2>
                    <p>Select a user from the sidebar to start messaging</p>
                </div>
            </div>
            <div class="input-area">
                <form class="message-form" id="messageForm">
                    <input type="text" id="messageInput" placeholder="Type a message..." style="flex:1;padding:10px;border-radius:20px;border:1px solid #ddd;">
                    <button type="submit" class="btn-send" style="width:40px;height:40px;border-radius:50%;background:#667eea;color:white;border:none;"><i class="fas fa-paper-plane"></i></button>
                </form>
            </div>
        </main>
    </div>

    <script>
        const token = localStorage.getItem('access_token');
        if (!token) {
            window.location.replace('login.html');
        } else {
            const user = JSON.parse(localStorage.getItem('user') || '{"username":"User"}');
            document.getElementById('currentUsername').textContent = user.username;
            
            document.getElementById('logoutBtn').addEventListener('click', function() {
                localStorage.clear();
                window.location.replace('login.html');
            });
            
            document.getElementById('messageForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const input = document.getElementById('messageInput');
                const msg = input.value.trim();
                if (!msg) return;
                
                const area = document.getElementById('messagesArea');
                const div = document.createElement('div');
                div.style.cssText = 'background:#667eea;color:white;padding:10px 15px;border-radius:18px;margin:5px 0;align-self:flex-end;max-width:70%;';
                div.textContent = msg;
                area.appendChild(div);
                input.value = '';
            });
        }
    </script>
</body>
</html>
